name: Self-use Release

on:
  push:
    branches:
      - codex/self-use-release
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create. Leave empty to update self-use-latest."
        required: false
        type: string

permissions:
  contents: write

jobs:
  bridge:
    name: Bridge tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit -p packages/bridge/tsconfig.json
      - run: npm run bridge:build

      - name: Pack bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bridge-dist"
          npm pack --workspace=packages/bridge --pack-destination "$RUNNER_TEMP/bridge-dist"
          TARBALL="$(find "$RUNNER_TEMP/bridge-dist" -maxdepth 1 -type f -name '*.tgz' | head -n 1)"
          if [[ -z "$TARBALL" ]]; then
            echo "::error::Bridge tarball was not created"
            exit 1
          fi
          mv "$TARBALL" "$RUNNER_TEMP/bridge-dist/ccpocket-bridge-self-use.tgz"

      - uses: actions/upload-artifact@v4
        with:
          name: ccpocket-bridge-self-use
          path: ${{ runner.temp }}/bridge-dist/ccpocket-bridge-self-use.tgz

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read Flutter version from .mise.toml
        id: mise
        shell: pwsh
        run: |
          $mise = Get-Content .mise.toml -Raw
          if ($mise -notmatch 'flutter\s*=\s*"([^"]+)"') {
            Write-Error "Could not read Flutter version from .mise.toml"
            exit 1
          }
          "flutter_version=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.mise.outputs.flutter_version }}
          cache: true

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
        working-directory: apps/mobile
      - name: Precache Windows artifacts
        shell: pwsh
        working-directory: apps/mobile
        run: |
          $ErrorActionPreference = 'Stop'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              flutter precache --windows
              exit 0
            } catch {
              if ($attempt -eq 3) { throw }
              Start-Sleep -Seconds (10 * $attempt)
            }
          }

      - name: Build Windows app with retry
        shell: pwsh
        working-directory: apps/mobile
        run: |
          $ErrorActionPreference = 'Stop'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              flutter build windows --release
              exit 0
            } catch {
              $firebaseCmake = Join-Path (Get-Location) "build/windows/x64/extracted/firebase_cpp_sdk_windows/CMakeLists.txt"
              if (Test-Path $firebaseCmake) {
                $cmakeText = Get-Content $firebaseCmake -Raw
                $patchedText = $cmakeText -replace 'cmake_minimum_required\(VERSION\s+[0-9.]+\)', 'cmake_minimum_required(VERSION 3.5...3.31)'
                if ($patchedText -ne $cmakeText) {
                  Write-Warning "Patching Firebase Windows CMakeLists for newer CMake compatibility..."
                  Set-Content -Path $firebaseCmake -Value $patchedText -NoNewline
                  try {
                    flutter build windows --release
                    exit 0
                  } catch {
                    Write-Warning "Windows build still failed after Firebase CMake patch on attempt $attempt."
                  }
                }
              }
              if ($attempt -eq 3) { throw }
              Write-Warning "flutter build windows failed on attempt $attempt, retrying..."
              flutter clean
              flutter pub get
              Start-Sleep -Seconds (15 * $attempt)
            }
          }

      - name: Package Windows bundle
        shell: pwsh
        run: |
          $distDir = Join-Path $env:RUNNER_TEMP "windows-dist"
          $bundleName = "CC-Pocket-windows-x64"
          $archiveName = "CC-Pocket-windows-x64-self-use.zip"
          $sourceDir = "apps/mobile/build/windows/x64/runner/Release"
          $bundleDir = Join-Path $distDir $bundleName

          if (!(Test-Path $sourceDir)) {
            Write-Host "Windows build output was not found at the expected path."
            Write-Host "Contents under apps/mobile/build/windows/x64:"
            Get-ChildItem "apps/mobile/build/windows/x64" -Recurse -Force -ErrorAction SilentlyContinue |
              Select-Object -First 200 FullName
            exit 1
          }

          New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null
          Copy-Item -Path "$sourceDir/*" -Destination $bundleDir -Recurse -Force
          Compress-Archive -Path $bundleDir -DestinationPath $archiveName -Force

      - uses: actions/upload-artifact@v4
        with:
          name: CC-Pocket-windows-x64-self-use
          path: CC-Pocket-windows-x64-self-use.zip

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read Flutter version from .mise.toml
        id: mise
        run: echo "flutter_version=$(grep 'flutter' .mise.toml | sed 's/.*= *\"//' | sed 's/\"//')" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.mise.outputs.flutter_version }}
          cache: true

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Use precompiled Rust artifacts
        run: |
          printf '%s\n' 'use_precompiled_binaries: true' > apps/mobile/cargokit_options.yaml

      - run: flutter pub get
        working-directory: apps/mobile

      - name: Build Android APK
        working-directory: apps/mobile
        run: |
          flutter build apk --release \
            --dart-define=REVENUECAT_PUBLIC_KEY= \
            --no-tree-shake-icons

      - name: Collect Android APK
        run: |
          mkdir -p "$RUNNER_TEMP/android-dist"
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk \
            "$RUNNER_TEMP/android-dist/CC-Pocket-android-arm64-self-use.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CC-Pocket-android-self-use
          path: ${{ runner.temp }}/android-dist/CC-Pocket-android-arm64-self-use.apk

  macos:
    name: macOS self-use DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read Flutter version from .mise.toml
        id: mise
        run: echo "flutter_version=$(grep 'flutter' .mise.toml | sed 's/.*= *\"//' | sed 's/\"//')" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.mise.outputs.flutter_version }}
          cache: true

      - run: flutter pub get
        working-directory: apps/mobile

      - name: Build macOS app
        working-directory: apps/mobile
        run: flutter build macos --release

      - name: Re-sign and verify macOS app bundle for self-use distribution
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="apps/mobile/build/macos/Build/Products/Release/CC Pocket.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error::macOS app bundle not found at $APP_PATH"
            exit 1
          fi

          ENTITLEMENTS_PATH="apps/mobile/macos/Runner/Release.entitlements"
          if [[ ! -f "$ENTITLEMENTS_PATH" ]]; then
            echo "::error::Missing entitlements file at $ENTITLEMENTS_PATH"
            exit 1
          fi

          # Re-sign nested binaries consistently so the bundle remains launchable
          # after being moved to another Mac, even without Developer ID signing.
          SPARKLE_FRAMEWORK_PATH="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          if [[ -d "$SPARKLE_FRAMEWORK_PATH" ]]; then
            SPARKLE_VERSION_DIR="$SPARKLE_FRAMEWORK_PATH/Versions/B"

            for SPARKLE_HELPER in \
              "$SPARKLE_VERSION_DIR/Autoupdate" \
              "$SPARKLE_VERSION_DIR/XPCServices/Downloader.xpc" \
              "$SPARKLE_VERSION_DIR/XPCServices/Installer.xpc" \
              "$SPARKLE_VERSION_DIR/Updater.app"; do
              if [[ -e "$SPARKLE_HELPER" ]]; then
                codesign --force --sign - "$SPARKLE_HELPER"
              fi
            done

            codesign --force --sign - "$SPARKLE_FRAMEWORK_PATH"
          fi

          find "$APP_PATH/Contents/Frameworks" \
            -type f \
            \( -perm -111 -o -name "*.dylib" \) \
            -print0 | while IFS= read -r -d '' BIN; do
              codesign --force --sign - "$BIN"
            done

          codesign --force --deep --sign - \
            --entitlements "$ENTITLEMENTS_PATH" \
            "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH" || true

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Package macOS DMG
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="apps/mobile/build/macos/Build/Products/Release/CC Pocket.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error::macOS app bundle not found at $APP_PATH"
            exit 1
          fi
          rm -f "CC-Pocket-macos-self-use.dmg"
          create-dmg \
            --volname "CC Pocket" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "CC Pocket.app" 150 185 \
            --app-drop-link 450 185 \
            --no-internet-enable \
            "CC-Pocket-macos-self-use.dmg" \
            "$APP_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: CC-Pocket-macos-self-use
          path: CC-Pocket-macos-self-use.dmg

  ios:
    name: iOS no-codesign app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read Flutter version from .mise.toml
        id: mise
        run: echo "flutter_version=$(grep 'flutter' .mise.toml | sed 's/.*= *\"//' | sed 's/\"//')" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.mise.outputs.flutter_version }}
          cache: true

      - name: Use precompiled Rust artifacts
        run: |
          printf '%s\n' 'use_precompiled_binaries: true' > apps/mobile/cargokit_options.yaml

      - run: flutter pub get
        working-directory: apps/mobile

      - name: Build iOS app without code signing
        working-directory: apps/mobile
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=REVENUECAT_PUBLIC_KEY= \
            --no-tree-shake-icons

      - name: Package unsigned iOS IPA
        run: |
          APP_PATH="apps/mobile/build/ios/iphoneos/Runner.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error::iOS Runner.app not found at $APP_PATH"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload "CC-Pocket-ios-no-codesign-self-use.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: CC-Pocket-ios-no-codesign-self-use
          path: CC-Pocket-ios-no-codesign-self-use.ipa

  release:
    name: Create GitHub release
    needs:
      - bridge
      - windows
      - android
      - macos
      - ios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.release_tag }}"
          if [[ -z "$TAG" ]]; then
            TAG="self-use-latest"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Point release tag at this build
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force

      - name: Create release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          Self-use build from augumn/ccpocket.

          This self-use prerelease contains the Codex 429 auto-continuation bridge/client changes for testing before an upstream release.

          Assets:
          - Windows: unzip `CC-Pocket-windows-x64-self-use.zip` and run `ccpocket.exe`.
          - macOS: ad-hoc signed self-use DMG. If Gatekeeper still blocks it, remove quarantine locally before opening.
          - Android: release APK signed with the debug fallback key when no release keystore is configured.
          - iOS: unsigned IPA for local re-signing. It is not installable until signed with your own certificate/provisioning profile.
          - Bridge: npm tarball. Example:

          ```bash
          npx -y https://github.com/augumn/ccpocket/releases/download/${{ steps.tag.outputs.tag }}/ccpocket-bridge-self-use.tgz ccpocket-bridge
          ```

          This is intentionally separate from the upstream formal release workflow and does not upload to App Store, TestFlight, Google Play, Shorebird, or npm.
          EOF

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "CC Pocket self-use $TAG" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "$TAG" \
              --title "CC Pocket self-use $TAG" \
              --notes-file release-notes.md \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" dist/* --clobber
